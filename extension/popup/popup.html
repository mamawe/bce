<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCE 设置</title>
  <style>
    :root {
      --primary: #2563eb;
      --border: #e5e7eb;
      --muted: #6b7280;
      --bg-soft: #f9fafb;
      --text: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 26px; height: 26px; border-radius: 6px;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }
    .title { font-size: 14px; font-weight: 700; }
    .subtitle { font-size: 11px; color: var(--muted); }

    .section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .section:last-child { border-bottom: none; }
    .label { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 7px; display: block; }

    input[type="text"] {
      width: 100%; padding: 7px 9px; font-size: 12px;
      border: 1px solid var(--border); border-radius: 6px; outline: none;
      color: var(--text);
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0;
    }
    .row-text { font-size: 13px; }
    .row-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #d1d5db; border-radius: 22px; transition: 0.2s ease;
    }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s ease;
    }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    .status {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 11px; border-radius: 8px; background: var(--bg-soft);
      font-size: 12px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: #9ca3af; }
    .dot.ok { background: #16a34a; }
    .dot.bad { background: #dc2626; }
    .dot.loading { background: #f59e0b; }
    .status-text { flex: 1; }
    .recheck {
      border: 1px solid var(--border); background: #fff; color: var(--primary);
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    }
    .recheck:hover { background: var(--bg-soft); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .saved { color: #16a34a; font-size: 11px; margin-left: 6px; opacity: 0; transition: opacity 0.2s; }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <div>
      <div class="title">BCE 业务上下文引擎</div>
      <div class="subtitle">阅读伴随 · Reading Companion</div>
    </div>
  </div>

  <div class="section">
    <label class="label" for="apiUrl">后端服务地址</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:8000" spellcheck="false" />
    <div class="hint">实体识别与上下文数据来自该服务。<span class="saved" id="savedTip">已保存</span></div>
  </div>

  <div class="section">
    <div class="row">
      <div>
        <div class="row-text">启用实体高亮</div>
        <div class="row-desc">在阅读时自动标注业务实体</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <div>
        <div class="row-text">悬停触发</div>
        <div class="row-desc">关闭后仅点击实体才显示面板</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="hoverTrigger" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <label class="label">服务状态</label>
    <div class="status">
      <span class="dot loading" id="statusDot"></span>
      <span class="status-text" id="statusText">检测中…</span>
      <button class="recheck" id="recheck">重新检测</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
